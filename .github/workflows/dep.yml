name: Update dependencies

on:
  workflow_dispatch:
    inputs:
      dependencies-content:
        description: The content of dependencies
        required: true
        type: string

jobs:
  update-dependencies:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get dependencies
        id: dep
        uses: AgoraIO-Extensions/actions/.github/actions/dep@main
        with:
          dependencies-content: ${{ inputs.dependencies-content }}

      - name: Update dependencies
        id: update_dependencies
        run: |
          sh scripts/internal/dep.sh ${{ steps.dep.outputs.matches }}

      - name: Update terra shared headers
        if: ${{ steps.update_dependencies.outputs.dep_version != '' && steps.update_dependencies.outputs.windows_dependency_url != '' }}
        uses: AgoraIO-Extensions/terra_shared_configs/.github/actions/update_headers@main
        with:
          url: ${{ steps.update_dependencies.outputs.windows_dependency_url }}
          version: ${{ steps.update_dependencies.outputs.dep_version }}
          product_type: rtc
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate code and comment by terra
        uses: AgoraIO-Extensions/actions/.github/actions/generate@main
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          generate-code: true
          generate-comment: true
          generate-code-command: |
            sh generate-prepare.sh
            sh generate-code.sh
          generate-comment-command: |
            sh generate-comment.sh

      - name: Create pull request
        uses: AgoraIO-Extensions/actions/.github/actions/pr@main
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          target-repo: ${{ github.workspace }}
          target-branch: ${{ github.ref_name }}
          target-branch-name-surffix: dep-update
          pull-request-title: |
            [AUTO] Update dependencies
          pull-request-body: |
            Dependencies content:

            ${{ steps.dep.outputs.matches }}
